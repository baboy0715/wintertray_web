<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Az oldal nem található | WinterTray</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .error-card {
      background: var(--bg-card);
      border: 1px solid var(--border-frost);
      border-radius: var(--radius-xl);
      padding: 50px 40px;
      max-width: 500px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(20px);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 20%, var(--ice-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <canvas id="snow-canvas"></canvas>
  <div class="content-wrapper">
    <div class="error-wrapper">
      <div class="error-card">
        <div class="error-code">404</div>
        <h1 style="font-size: 1.5rem; margin-bottom: 12px; color: #fff;">Elvesztél a hóviharban?</h1>
        <p style="color: var(--text-muted); margin-bottom: 28px;">A keresett oldal nem található vagy elolvadt. Látogass el a WinterTray főoldalára!</p>
        <a href="/" class="btn-primary-download" style="justify-content: center; display: inline-flex;">
          <span>❄️ Vissza a főoldalra</span>
        </a>
      </div>
    </div>
  </div>
  <script src="snow.js"></script>
  <script>
    if (window.SnowEngine) new window.SnowEngine('snow-canvas');
  </script>
</body>
</html>
